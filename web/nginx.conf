server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Tek sayfa uygulaması — bilinmeyen yollar index.html'e düşer.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Kontrol düzlemi. Aynı origin'den sunulduğu için CORS gerekmiyor.
  location /api/ {
    proxy_pass http://control-api:8090;
    proxy_http_version 1.1;

    # İndeksleme ilerlemesi SSE ile akıyor: tamponlama kapatılmalı,
    # yoksa loglar iş bitene kadar görünmez.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
