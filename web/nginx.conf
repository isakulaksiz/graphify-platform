server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Tek sayfa uygulaması — bilinmeyen yollar index.html'e düşer.
  #
  # index.html ASLA önbelleğe alınmamalı. Cache-Control verilmezse tarayıcı
  # sezgisel önbellekleme yapıyor ve eski index.html eski bundle'ı işaret
  # ediyor — kullanıcı güncellemeyi ancak hard refresh ile görüyor.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Bundle adları içerik hash'i taşıyor (index-B3FWSFde.js), dolayısıyla
  # sonsuza kadar önbelleklenebilir: içerik değişince ad da değişir.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Kontrol düzlemi. Aynı origin'den sunulduğu için CORS gerekmiyor.
  location /api/ {
    proxy_pass http://control-api:8090;
    proxy_http_version 1.1;

    # İndeksleme ilerlemesi SSE ile akıyor: tamponlama kapatılmalı,
    # yoksa loglar iş bitene kadar görünmez.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
  }
}
